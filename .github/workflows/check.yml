name: Check dashboard
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anime-calendar-dashboard/package-lock.json
      - run: npm ci
        working-directory: anime-calendar-dashboard
      - run: npm test
        working-directory: anime-calendar-dashboard
      - run: npm run build
        working-directory: anime-calendar-dashboard
